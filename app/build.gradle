plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxcleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.boxcleaner"
        // Android box của bạn chạy Android 8.1 (API 27)
        minSdk 26
        targetSdk 27
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
